name: CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

jobs:
  test:
    name: 🧪 Executar Testes Automatizados
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Executar Testes com Pytest
        run: |
          python -m pytest tests -v --tb=short

  build:
    name: 📦 Compilar Executável (.exe)
    needs: test
    runs-on: windows-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Instalar dependências do projeto e PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: ⚙️ Compilar Executável com PyInstaller
        run: |
          python -m PyInstaller --noconfirm --onedir --windowed `
            --name "BACKUP-BOT-iDFace" `
            --collect-all flet `
            --collect-all pymysql `
            --collect-all cryptography `
            --hidden-import "pymysql.cursors" `
            --hidden-import "cryptography" `
            main.py

      - name: 📤 Publicar Binário como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BACKUP-BOT-iDFace-Windows
          path: dist/BACKUP-BOT-iDFace/
          retention-days: 14
